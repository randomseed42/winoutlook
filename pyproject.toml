[project]
name = "winoutlook"
version = "0.1.0"
description = "A Windows-only Python library for sending emails through locally installed Microsoft Outlook using win32 COM."
readme = "README.md"
requires-python = ">=3.13"
license-files = ["LICENSE"]
authors = [{ name = "randomseed42", email = "randomseed42@protonmail.com" }]
keywords = ["email", "outlook", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Environment :: Win32 (MS Windows)",
]
dependencies = [
    "email-validator",
    "pywin32; platform_system=='Windows'",
]

[project.urls]
Homepage = "https://github.com/randomseed42/winoutlook"

[project.scripts]
winoutlook = "winoutlook.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pytest",
    "ruff",
    "setuptools>=80.9.0",
]
